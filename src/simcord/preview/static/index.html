<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SimCord Preview</title>
    <link rel="stylesheet" href="/preview.css">
  </head>
  <body>
    <header class="preview-toolbar" id="toolbar" role="toolbar" aria-label="Preview inspector">
      <label class="toolbar-field">Viewer <select id="viewer-picker" aria-label="Viewer"></select></label>
      <label class="toolbar-field">Message <select id="message-picker" aria-label="Focused message"></select></label>
      <label class="toolbar-field">Width <input id="viewport-width" type="number" min="240" max="32768" step="1"></label>
      <label class="toolbar-field">Height <input id="viewport-height" type="number" min="180" max="32768" step="1"></label>
      <button id="refresh" type="button">Refresh</button>
      <button id="close" type="button">Close</button>
      <span id="action-status" class="toolbar-status" role="status" aria-live="polite"></span>
    </header>
    <div class="preview-workspace">
      <main id="preview-app" class="preview-app" aria-busy="true">
        <section id="channel-layout" class="channel-layout" aria-label="Channel" hidden>
          <header class="channel-header">
            <span class="channel-hash" aria-hidden="true">#</span>
            <div class="channel-heading">
              <h1 id="channel-name"></h1>
              <p id="channel-topic"></p>
            </div>
          </header>
          <button id="history-older" class="history-button" type="button" hidden>Load earlier messages</button>
          <div id="channel-timeline" class="channel-timeline" role="log" aria-live="polite">
            <p id="channel-empty" class="channel-empty" hidden>No messages in this channel.</p>
            <div id="channel-message-list"></div>
          </div>
          <button id="history-newer" class="history-button" type="button" hidden>Newer messages</button>
          <form id="channel-composer" class="channel-composer" hidden>
            <div id="reply-context" class="composer-reply" hidden>
              <span id="reply-label"></span>
              <button id="reply-cancel" type="button" aria-label="Cancel reply">×</button>
            </div>
            <div class="composer-row">
              <label class="visually-hidden" for="channel-composer-input">Message</label>
              <textarea id="channel-composer-input" maxlength="2000" rows="1" placeholder="Message"></textarea>
              <button id="send-message" class="send-message" type="submit">Send</button>
            </div>
          </form>
        </section>
        <section id="message-picker-empty" class="empty-state" hidden aria-live="polite">No visible messages.</section>
        <article id="message-surface" class="message-surface" aria-label="Focused message" hidden></article>
        <section id="modal-root" class="modal-root" aria-label="Dialog"></section>
      </main>
      <aside id="diagnostics" class="diagnostics" aria-label="Diagnostics"></aside>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
