# Early warning for discord.py internal changes: run the suite against the
# upstream development branch every week (and on demand).
name: discord.py master

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv sync --locked --extra dev --extra screenshot
          uv pip install --no-deps -U "discord.py @ git+https://github.com/Rapptz/discord.py"
      # Do not let project sync replace the upstream checkout with locked discord.py.
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - run: uv run --no-sync python -c "import discord; print(discord.__version__)"
      - run: uv run --no-sync pytest tests examples -q
